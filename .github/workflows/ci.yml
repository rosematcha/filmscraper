name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Tests run against committed fixtures and never hit the network.
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: netlify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A deploy replaces the whole site, so every published file the build does
      # not carry is a file deleted. Hand-rolling that per file is what dropped
      # the two JSON exports on each code push; restoreData already fetches and
      # validates all of them, and refuses to mix exports from another scrape.
      #
      # This runs only after acquiring the same lock as the scheduled scrape,
      # so the code deploy always carries the newest published data.
      - name: Preserve published data
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL"
          pnpm exec tsx src/restoreData.ts "$SITE_URL" web/public/data
          # A deploy without listings would replace the site with an empty one.
          test -f web/public/data/latest.json

      - run: pnpm --filter filmscraper-web build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          pnpm --package=netlify-cli@17 dlx netlify deploy
          --dir web/dist
          --prod
          --site "$NETLIFY_SITE_ID"
          --filter filmscraper
          --message "code ${{ github.sha }}"
