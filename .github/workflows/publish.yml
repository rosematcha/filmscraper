name: Publish listings

on:
  schedule:
    # These must stay in step with SCHEDULES in src/core/schedule.ts, which
    # decides which sources a given slot actually scrapes; tests/schedule.test.ts
    # parses the lines below and fails if the two drift apart.
    #
    # Fandango's hourly watch, Tuesday noon to Wednesday noon CDT (UTC-5), dark
    # from 10pm to 4am local. Its first hour is also the shared slot every
    # calendar source runs in.
    - cron: '0 17-23 * * 2'
    - cron: '0 0-2,9-17 * * 3'
    # The evening slot: Thursday for the drive-in and the library, Saturday for
    # Fandango's full sweep of the coming week.
    - cron: '0 18 * * 4,6'
  workflow_dispatch:
    inputs:
      radius:
        description: Radius to scrape, in miles
        default: '35'
      days:
        description: Days to cover, starting today
        default: '31'
      concurrency:
        description: Fandango pages to fetch at once
        default: '6'
      dry_run:
        description: Scrape and build, but do not deploy
        type: boolean
        default: false

# One run at a time: two scrapes deploying at once would race.
concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Fandango is the slow part; a month at 35 mi is several ZIP seeds per date.
    timeout-minutes: 60

    steps:
      # Checked before the 10-minute scrape rather than after it: an unset
      # secret otherwise surfaces as the Netlify CLI failing to auto-detect a
      # site, long after the expensive work is done.
      - name: Check deploy credentials
        if: ${{ inputs.dry_run != true }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=""
          [ -z "$NETLIFY_AUTH_TOKEN" ] && missing="$missing NETLIFY_AUTH_TOKEN"
          [ -z "$NETLIFY_SITE_ID" ] && missing="$missing NETLIFY_SITE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions, or re-run with dry_run enabled."
            exit 1
          fi
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::warning::SITE_URL variable is unset, so partial runs cannot reuse the previous dataset and will scrape every source."
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Scrape
        # A manual run does everything; a scheduled one only what is due, then
        # merges with the last published dataset so untouched sources survive.
        run: >
          pnpm publish:data
          --radius ${{ inputs.radius || '35' }}
          --days ${{ inputs.days || '31' }}
          --concurrency ${{ inputs.concurrency || '6' }}
          --out web/public/data/latest.json
          --merge-from "$SITE_URL/data/latest.json"
          ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # blobsKv uses this name outside the Netlify function runtime.
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Stop if nothing was scraped
        id: check
        run: |
          if [ -f web/public/data/latest.json ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing was due at this hour; skipping build and deploy."
          fi

      - name: Preserve the listing ledger
        if: steps.check.outputs.changed == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # A deploy replaces the whole site, so a ledger the build does not
          # carry is a ledger deleted. Openings are judged against it and it
          # takes weeks of runs to rebuild, so it is carried forward whenever
          # this run did not produce one of its own.
          if [ -f web/public/data/ledger.json ]; then
            echo "This run produced a ledger; keeping it."
            exit 0
          fi
          mkdir -p web/public/data
          tmp=$(mktemp)
          if curl -fsS --max-time 30 "$SITE_URL/data/ledger.json" -o "$tmp" && node -e "const l=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); if(l.version!==1||typeof l.since!=='string'||typeof l.films!=='object'||l.films===null) process.exit(1)" "$tmp"; then
            mv "$tmp" web/public/data/ledger.json
            echo "Carried the published ledger forward."
          else
            rm -f "$tmp"
            echo "No published ledger to carry forward yet."
          fi

      - name: Build site
        if: steps.check.outputs.changed == 'true'
        run: pnpm --filter filmscraper-web build

      - name: Deploy to Netlify
        if: ${{ steps.check.outputs.changed == 'true' && inputs.dry_run != true }}
        # Deployed straight from CI rather than committed, so the scheduled runs
        # never appear as bot commits in the repository history.
        #
        # Two CLI quirks, both fatal without these flags:
        #  - `--package` because netlify-cli ships two binaries (ntl, netlify)
        #    and a bare `pnpm dlx netlify-cli` fails with MULTIPLE_BINS.
        #  - `--filter` because this is a pnpm workspace. The CLI scans for
        #    package.json names, finds `filmscraper` and `filmscraper-web`, and
        #    refuses to guess — even when `--site` already names the target.
        run: >
          pnpm --package=netlify-cli@17 dlx netlify deploy
          --dir web/dist
          --prod
          --site "$NETLIFY_SITE_ID"
          --filter filmscraper
          --message "listings ${{ github.run_number }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Summarise
        if: always()
        run: |
          if [ -f web/public/data/latest.json ]; then
            node -e '
              const fs = require("node:fs");
              const d = require("./web/public/data/latest.json");
              const kb = (fs.statSync("web/public/data/latest.json").size / 1024).toFixed(0);
              const fullKb = fs.existsSync("web/public/data/full.json")
                ? (fs.statSync("web/public/data/full.json").size / 1024).toFixed(0)
                : "—";
              const truncKb = fs.existsSync("web/public/data/truncated.json")
                ? (fs.statSync("web/public/data/truncated.json").size / 1024).toFixed(0)
                : "—";
              let truncFilms = "—";
              if (fs.existsSync("web/public/data/truncated.json")) {
                truncFilms = String(JSON.parse(fs.readFileSync("web/public/data/truncated.json", "utf8")).films.length);
              }
              console.log(`| field | value |\n|---|---|`);
              console.log(`| window | ${d.from} → ${d.to} |`);
              console.log(`| radius | ${d.radiusMiles} mi |`);
              console.log(`| horizon | ${d.horizon} |`);
              console.log(`| venue-days | ${d.days.length} |`);
              console.log(`| latest.json | ${kb} KB |`);
              console.log(`| full.json | ${fullKb} KB |`);
              console.log(`| truncated.json | ${truncKb} KB (${truncFilms} films) |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
