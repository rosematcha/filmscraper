# The site is the Vite build, not the compiled Node backend in ./dist.
# Publishing ./dist is what produced a 404: it holds cli.js and server.js and
# no index.html at all.
[build]
  base = "/"
  # Production deploys are serialized through GitHub Actions. Netlify's own
  # production build would be a second uncoordinated writer that can restore an
  # older dataset; deploy previews still build normally.
  ignore = "if [ \"$CONTEXT\" = production ]; then exit 0; else exit 1; fi"
  # A git push must not clobber the nightly data with an empty build, so the
  # current dataset is pulled from the live site first. Missing data is not an
  # error: the site says so plainly and the next scheduled scrape fills it in.
  command = "pnpm install --frozen-lockfile && mkdir -p web/public/data && dataset_tmp=$(mktemp) && if curl -sfS --max-time 30 \"$URL/data/latest.json\" -o \"$dataset_tmp\" && node -e \"const d=JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')); if(d.version!==2 || !Array.isArray(d.days) || typeof d.generatedAt!=='string') process.exit(1)\" \"$dataset_tmp\"; then mv \"$dataset_tmp\" web/public/data/latest.json; for export_name in full truncated; do export_tmp=$(mktemp); if curl -sfS --max-time 30 \"$URL/data/$export_name.json\" -o \"$export_tmp\" && node -e \"const d=JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')); if(d.version!==1 || d.mode!==process.argv[2] || !Array.isArray(d.theaters) || !Array.isArray(d.films)) process.exit(1)\" \"$export_tmp\" \"$export_name\"; then mv \"$export_tmp\" \"web/public/data/$export_name.json\"; else rm -f \"$export_tmp\"; echo \"no valid published $export_name export available\"; fi; done; else rm -f \"$dataset_tmp\"; echo 'no valid published dataset available'; fi && pnpm --filter filmscraper-web build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# Signup, confirm and unsubscribe. Each function declares its /api/* path in
# its own config export; custom function paths win over the SPA rewrite below,
# so no /api redirect rule is needed.
[functions]
  directory = "netlify/functions"

# A missing dataset must 404 rather than fall through to the SPA shell. Static
# files are served before redirects, so this only fires when the file is absent
# — which keeps "not published yet" distinguishable from "served you HTML".
[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 404

# Single-page app: unknown paths serve the shell rather than a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
